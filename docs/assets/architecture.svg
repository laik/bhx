<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#566070"/>
    </marker>
  </defs>

  <style>
    .box  { fill:#ffffff; stroke:#8a94a6; stroke-width:1.2; rx:8; }
    .core { fill:#f2f7ff; stroke:#4f7bb0; }
    .side { fill:#fffaf0; stroke:#b08b4f; }
    .leaf { fill:#f4f4f5; stroke:#6b7280; }
    .t    { font-size:14px; fill:#14181f; font-weight:600; }
    .s    { font-size:11.5px; fill:#4b5563; }
    .lbl  { font-size:11px; fill:#566070; }
    .ln   { stroke:#566070; stroke-width:1.3; fill:none; }
  </style>

  <text x="20" y="26" font-size="15" font-weight="700" fill="#14181f">my-browser-harness (bhx) — one engine, three front doors</text>

  <!-- callers -->
  <g>
    <rect class="box leaf" x="20" y="46" width="230" height="44" rx="8"/>
    <text class="t" x="36" y="66">AI agents</text>
    <text class="s" x="36" y="82">Claude Code · Pi · scripts (MCP stdio)</text>

    <rect class="box leaf" x="300" y="46" width="230" height="44" rx="8"/>
    <text class="t" x="316" y="66">Scripts / CI</text>
    <text class="s" x="316" y="82">REST + WebSocket events</text>

    <rect class="box leaf" x="580" y="46" width="230" height="44" rx="8"/>
    <text class="t" x="596" y="66">Humans</text>
    <text class="s" x="596" y="82">bhx CLI: observe · run · task · trace</text>
  </g>

  <!-- api -->
  <rect class="box core" x="20" y="118" width="790" height="44" rx="8"/>
  <text class="t" x="36" y="138">API layer</text>
  <text class="s" x="120" y="138">MCP tools (browser_* / task_* / interactive_*) · REST /v1 · resumable event stream</text>

  <!-- task engine -->
  <rect class="box core" x="20" y="190" width="540" height="70" rx="8"/>
  <text class="t" x="36" y="212">Task Engine</text>
  <text class="s" x="36" y="229">state machine · checkpoints · approvals · artifacts · recovery</text>
  <text class="s" x="36" y="245">Task Router: per-step path choice, DOM → vision reroute</text>

  <!-- store -->
  <rect class="box side" x="590" y="190" width="220" height="70" rx="8"/>
  <text class="t" x="606" y="212">Storage</text>
  <text class="s" x="606" y="229">SQLite: tasks, steps, events,</text>
  <text class="s" x="606" y="244">artifacts, schedules, approvals</text>

  <!-- executors -->
  <rect class="box core" x="20" y="288" width="540" height="76" rx="8"/>
  <text class="t" x="36" y="308">Executors</text>
  <text class="s" x="36" y="325">DOM Executor — structured actions + success conditions</text>
  <text class="s" x="36" y="340">Vision Executor — screenshot → bbox → coordinates → verify</text>
  <text class="s" x="36" y="355">Interactive Controller — 30 Hz rule loop, model out of the loop</text>

  <!-- model router -->
  <rect class="box side" x="590" y="288" width="220" height="76" rx="8"/>
  <text class="t" x="606" y="308">Model Router</text>
  <text class="s" x="606" y="325">Plan · Locate · VisualLocate</text>
  <text class="s" x="606" y="340">Verify · Repair</text>
  <text class="s" x="606" y="355">budgets · validation · fallback</text>

  <!-- action runtime -->
  <rect class="box core" x="20" y="392" width="540" height="48" rx="8"/>
  <text class="t" x="36" y="412">Action Runtime</text>
  <text class="s" x="36" y="429">locator resolution · actionability · dispatch · conditions · cancel &lt; 200 ms</text>

  <!-- observation -->
  <rect class="box side" x="590" y="392" width="220" height="106" rx="8"/>
  <text class="t" x="606" y="412">Observation Engine</text>
  <text class="s" x="606" y="429">accessibility tree · DOM ·</text>
  <text class="s" x="606" y="444">screenshots · element index</text>
  <text class="s" x="606" y="459">(e1, e2, …) · budgets · diffs</text>
  <text class="s" x="606" y="474">password redaction · hashing</text>

  <!-- browser runtime -->
  <rect class="box core" x="20" y="470" width="540" height="48" rx="8"/>
  <text class="t" x="36" y="490">Browser Runtime</text>
  <text class="s" x="36" y="507">context / profile per task · navigation · input · downloads · dialogs</text>

  <!-- chromium -->
  <rect class="box leaf" x="20" y="550" width="790" height="44" rx="8"/>
  <text class="t" x="36" y="570">Chromium</text>
  <text class="s" x="130" y="570">CDP over WebSocket — self-contained thin client; launch a local Chrome, or attach to a running one (BH_CDP_URL)</text>

  <!-- arrows -->
  <path class="ln" d="M135,90 L135,118" marker-end="url(#a)"/>
  <path class="ln" d="M415,90 L415,118" marker-end="url(#a)"/>
  <path class="ln" d="M695,90 L695,118" marker-end="url(#a)"/>
  <path class="ln" d="M290,162 L290,190" marker-end="url(#a)"/>
  <path class="ln" d="M290,260 L290,288" marker-end="url(#a)"/>
  <path class="ln" d="M290,364 L290,392" marker-end="url(#a)"/>
  <path class="ln" d="M290,440 L290,470" marker-end="url(#a)"/>
  <path class="ln" d="M290,518 L290,550" marker-end="url(#a)"/>
  <path class="ln" d="M560,225 L590,225" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M560,326 L590,326" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M810,445 L860,445 L860,340 L810,340" marker-start="url(#a)"/>
  <path class="ln" d="M700,498 L700,522 L560,522 L560,416" marker-end="url(#a)"/>
  <path class="ln" d="M480,550 L480,522" marker-start="url(#a)"/>
  <text class="lbl" x="760" y="332">model calls</text>
  <text class="lbl" x="760" y="430">observations</text>
  <text class="lbl" x="300" y="182">state, events, artifacts</text>
  <text class="lbl" x="612" y="518">CDP events + snapshots</text>
</svg>
